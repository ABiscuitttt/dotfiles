# Open file:// hyperlinks (e.g. from `kitten hyperlinked_grep`) in VS Code,
# jumping to the line number from the URL fragment (which is a bare number).
protocol file
fragment_matches [0-9]+
action launch --type=background code --goto ${FILE_PATH}:${FRAGMENT}

# Fallback for file:// links without a line-number fragment.
protocol file
action launch --type=background code ${FILE_PATH}
